version: "2"

# This project uses golangci-lint's default (standard) linter set plus gocyclo.
# See https://golangci-lint.run/ for what "standard" enables: errcheck, govet,
# ineffassign, staticcheck, and unused. Formatting is handled by gofmt via
# `golangci-lint fmt`.
#
# Run locally with `golangci-lint run`; auto-fix formatting with
# `golangci-lint fmt`.

linters:
  default: standard
  enable:
    # Carries over the cyclomatic-complexity gate that used to run as a
    # standalone `gocyclo -over 16` step in the Makefile. gocyclo reports
    # functions *above* min-complexity, so 16 here is the same threshold.
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 16

formatters:
  enable:
    - gofmt
