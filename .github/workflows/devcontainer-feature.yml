name: Dev Container Feature

# Builds the mdm dev container feature into real containers and asserts the
# binary it installs actually runs. The feature is published from
# devcontainer-feature-release.yml; this is the gate in front of it.

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/devcontainer-feature.yml"
      # The CLI that runs these tests is pinned here, so a bump to it has to
      # run them - otherwise Dependabot's npm PR merges having proved nothing.
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/devcontainer-feature.yml"
      # The CLI that runs these tests is pinned here, so a bump to it has to
      # run them - otherwise Dependabot's npm PR merges having proved nothing.
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions: read-all

# The devcontainer CLI is pinned in package.json and locked with integrity
# hashes in package-lock.json, so `npm ci` installs a byte-identical CLI on
# every run - a CLI release cannot turn these tests red on an unrelated PR, and
# a compromised republish of a pinned version cannot slip in either. That is
# also what makes the install count as pinned to OpenSSF Scorecard, which reads
# `npm install -g <pkg>@<version>` as unpinned no matter how exact the version
# is. devcontainer-feature-release.yml reads the same pin out of package.json.

jobs:
  # Runs test/mdm/test.sh against each base image, with the feature installed at
  # its default options.
  autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - mdm
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
          # Slim images ship without curl or the CA bundle, which is the path
          # install.sh has to bootstrap before it can download anything.
          - debian:bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: npm ci

      - name: Test '${{ matrix.feature }}' on '${{ matrix.baseImage }}'
        run: npx devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} .

  # Runs the option and user scenarios in test/mdm/scenarios.json, each of which
  # pins its own base image.
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - mdm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: npm ci

      - name: Test '${{ matrix.feature }}' scenarios
        run: npx devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated .

  # Catches a devcontainer-feature.json that the CLI would reject at publish
  # time - a bad option type, a missing id - without pushing anything.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate feature metadata
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          # validate-only refuses to run alongside publish-features - it is the
          # non-publishing half of the action, and reads the features path on
          # its own. Setting both fails with "publishing steps and validateOnly
          # are mutually exclusive."
          validate-only: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
