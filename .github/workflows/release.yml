name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # needed for OIDC keyless cosign signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for changelog and validation

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.5.3'

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Release notes track stable-to-stable changes. GoReleaser otherwise picks
      # the previous tag by semver, which lands on a prerelease when one sits
      # just below the release being cut - v2.0.0-beta below v2.0.0 - so the
      # notes would start at the prerelease and omit everything back to the last
      # stable. Pin the previous tag to the most recent stable ancestor (no
      # prerelease suffix), skipping any -beta / -rc tags. A prerelease build
      # then gets cumulative notes from the last stable, and a stable build gets
      # exactly the stable-to-stable range. If none is found (the very first
      # tag), fall through to GoReleaser's own detection.
      - name: Pin the changelog to the previous stable tag
        run: |
          prev=$(git tag --list 'v*' --merged HEAD --sort=-version:refname \
            | awk -v cur="$GITHUB_REF_NAME" '!/-/ && $0 != cur' \
            | head -n1)
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
            echo "Changelog spans from previous stable tag: $prev"
          else
            echo "No previous stable tag found; using GoReleaser's default detection."
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute hashes for SLSA provenance
        id: hash
        run: echo "hashes=$(base64 -w0 < dist/sha256sums.txt)" >> $GITHUB_OUTPUT

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Note: slsa-github-generator reusable workflows MUST be referenced by tag,
    # not by commit SHA. The generator reads github.action_ref at runtime to
    # determine which binary release to download; a SHA reference breaks that
    # lookup. This is a documented upstream requirement:
    # https://github.com/slsa-framework/slsa-github-generator#referencing-slsa-builders-and-generators
    #
    # OpenSSF Scorecard reports this line as an unpinned third-party action. It
    # is the only unpinned dependency left in the repo and it is accepted, not
    # outstanding: the only way to clear it is to swap the generator for
    # actions/attest-build-provenance, which drops the release from SLSA Build
    # Level 3 to Level 2 and invalidates the slsa-verifier instructions in
    # SECURITY.md. Scorecard has no suppression syntax, so this comment is the
    # record. See "Dependency pinning" in AGENTS.md.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ github.ref_name }}"
