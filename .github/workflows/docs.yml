name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Pull requests build the site (--strict) without deploying, so docs
  # breakage is caught before merge and a required `build` check always
  # reports. No path filter: a required check that only sometimes runs
  # leaves every other PR waiting on it forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one concurrent deployment; don't cancel an in-progress push run.
# PR builds get their own group so they never queue behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # --require-hashes makes pip refuse anything whose artifact hash isn't
      # recorded in the lock file, and refuse the install outright if any
      # dependency is missing a hash or an == pin. docs/requirements.txt is
      # generated from docs/requirements.in by `make docs-lock`.
      - name: Install dependencies
        run: pip install --require-hashes -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Allow the GITHUB_TOKEN to deploy to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
