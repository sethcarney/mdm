version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all non-breaking Go module bumps. Major bumps stay
      # separate so they can be reviewed and tested individually.
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The docs site pins its Python deps by hand, so nothing bumps them unless
  # Dependabot watches this directory — that is how mkdocs-material sat on a
  # release whose pymdown-extensions cap excluded the fix for
  # GHSA-9xwg-3r6f-jcx2. requirements.in holds the direct deps and
  # requirements.txt is the hashed lock beside it, which Dependabot recompiles
  # as a pair (see the Makefile's docs-lock target for the local equivalent).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The root package.json exists only to pin the devcontainer CLI that
  # .github/workflows/devcontainer-feature.yml installs with `npm ci`. Nothing
  # in the mdm binary comes from npm — this entry keeps that one pin, and the
  # integrity hashes in package-lock.json beside it, from going stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope

  # The dev container base image is pinned by digest, which is a moving target
  # in a way a tag is not: the digest goes stale the moment upstream rebuilds
  # bookworm, and nothing in a build fails when it does. Only Dependabot's
  # docker ecosystem rewrites a `FROM image:tag@sha256:...` pin, and only when
  # it is pointed at the directory holding the Dockerfile.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      # codeql-action/init, /analyze and /upload-sarif are separate
      # dependencies to Dependabot but must be pinned to the same SHA,
      # so they always ship in a single PR — including major bumps.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else: one PR for non-breaking bumps, individual PRs
      # for majors.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - minor
          - patch
